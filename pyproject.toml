[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-web-simulator"
version = "0.1.0"
description = "UAV supervisory decision simulation prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "openpyxl>=3.1,<4",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "osmium>=4,<5", "pillow>=10,<11"]

[project.scripts]
uav-sim = "uav_sim.cli:main"
uav-web = "uav_sim.main:run"

[tool.setuptools.packages.find]
include = ["uav_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
